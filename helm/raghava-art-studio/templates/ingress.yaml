apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raghava-art
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - host: raghava.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
